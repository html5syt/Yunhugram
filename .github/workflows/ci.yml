name: 自动检查与调试版本
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.44.1'
  CARGO_BUILD_JOBS: '4'
  PUB_HOSTED_URL: https://pub.dev
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: python3 -m unittest discover -s scripts -p 'test_release_metadata.py'
  debug:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: apple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux 依赖
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - run: flutter pub get --enforce-lockfile
      - name: Android 调试版本
        if: matrix.platform == 'android'
        run: flutter build apk --debug --no-pub
      - name: Windows 调试版本
        if: matrix.platform == 'windows'
        run: flutter build windows --debug --no-pub
      - name: Linux 调试版本
        if: matrix.platform == 'linux'
        run: flutter build linux --debug --no-pub
      - name: Apple 调试版本
        if: matrix.platform == 'apple'
        run: |
          flutter build macos --debug --no-pub
          flutter build ios --debug --no-codesign --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/windows/x64/runner/Debug/
            build/linux/x64/debug/bundle/
            build/macos/Build/Products/Debug/*.app/
            build/ios/iphoneos/Runner.app/
